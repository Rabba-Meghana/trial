name: ci

on:
  push:
    branches: [main, liquidity-zero-launch]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lz
          POSTGRES_USER: lz
          POSTGRES_PASSWORD: lz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lz -d lz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LZ_DATABASE_URL: postgresql+psycopg://lz:lz@localhost:5432/lz
      LZ_API_KEY: ci-test-key
      LZ_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Lint Liquidity Zero
        run: ruff check lz tests
      - name: Static type check
        run: mypy lz
      - name: Run tests
        run: pytest tests
      - name: Build production image
        run: docker build -t liquidity-zero:${{ github.sha }} .
