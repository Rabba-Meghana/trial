[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liquidity-zero"
version = "0.1.0"
description = "Settlement Capacity Exchange core runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.41,<3",
  "psycopg[binary]>=3.2.9,<4",
  "prometheus-client>=0.22,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "hypothesis>=6.135,<7",
  "ruff>=0.12,<1",
  "mypy>=1.16,<2",
  "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings --cov=lz --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lz"]
